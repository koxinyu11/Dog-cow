<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>狗牛</title>
  <meta name="description" content="支持周一至周日的可编辑任务、进展与月历标识。" />
  <style>
    :root {
      --ink: #172019;
      --muted: #657168;
      --paper: #f6f5ef;
      --card: rgba(255, 255, 255, .88);
      --line: #dedfd6;
      --green: #255c48;
      --green-2: #dfece5;
      --orange: #db6d3a;
      --red: #b84235;
      --shadow: 0 18px 54px rgba(32, 48, 38, .10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(219,109,58,.14), transparent 32%),
        radial-gradient(circle at 90% 12%, rgba(37,92,72,.14), transparent 30%),
        var(--paper);
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { max-width: 1220px; margin: 0 auto; padding: 34px 26px 70px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .header-copy { min-width: 0; }
    .header-edit-line { width: fit-content; max-width: 100%; display: flex; align-items: center; gap: 8px; }
    .header-edit-line h1 { min-width: 52px; }
    .inline-edit-trigger { width: 25px; height: 25px; flex: none; padding: 0; border: 0; border-radius: 8px; color: #78837b; background: transparent; opacity: .38; }
    .header-edit-line:hover .inline-edit-trigger, .inline-edit-trigger:hover, .inline-edit-trigger:focus { opacity: 1; color: var(--green); background: var(--green-2); }
    .eyebrow { color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 6px 0 4px; font-family: Georgia, "Songti SC", serif; font-size: clamp(34px, 5vw, 58px); line-height: 1; font-weight: 500; }
    .date-line { color: var(--muted); font-size: 14px; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn { border: 1px solid var(--line); border-radius: 12px; padding: 11px 15px; color: var(--ink); background: rgba(255,255,255,.74); font-weight: 700; box-shadow: 0 4px 14px rgba(0,0,0,.03); }
    .btn:hover { transform: translateY(-1px); border-color: #b9bdb4; }
    .btn.primary { color: white; background: var(--green); border-color: var(--green); }
    .btn.ghost { background: transparent; box-shadow: none; }
    .top-grid { display: grid; grid-template-columns: 1.35fr .65fr; gap: 18px; margin-bottom: 22px; }
    .panel { border: 1px solid rgba(205,208,199,.9); border-radius: 22px; background: var(--card); box-shadow: var(--shadow); backdrop-filter: blur(12px); }
    .today { padding: 25px; overflow: hidden; position: relative; }
    .today::after { content: ""; position: absolute; width: 170px; height: 170px; border: 34px solid rgba(37,92,72,.06); border-radius: 50%; right: -70px; top: -84px; }
    .section-kicker { font-size: 13px; color: var(--muted); font-weight: 700; }
    .editable-heading { display: flex; align-items: center; gap: 7px; position: relative; z-index: 1; }
    .edit-heading { width: 25px; height: 25px; border: 0; border-radius: 8px; color: #8b948d; background: transparent; opacity: .65; }
    .edit-heading:hover { opacity: 1; color: var(--green); background: var(--green-2); }
    [contenteditable="true"].is-editing { outline: 2px solid rgba(47, 117, 95, .28); outline-offset: 4px; border-radius: 5px; cursor: text; min-width: 72px; }
    h2 { margin: 5px 0 18px; font-size: 25px; }
    .progress-row { display: flex; align-items: center; gap: 14px; }
    .rocket-track { height: 13px; flex: 1; position: relative; background: #e4e7e0; border-radius: 99px; }
    .rocket-fill { display: block; height: 100%; width: 0; position: relative; border-radius: inherit; background: linear-gradient(90deg, #74b89b, var(--green)); transition: width .55s cubic-bezier(.2,.8,.2,1); }
    .rocket { position: absolute; right: -15px; top: 50%; transform: translateY(-52%) rotate(43deg); font-size: 27px; filter: drop-shadow(0 4px 5px rgba(37,92,72,.28)); }
    .rocket-fill::after { content: ""; position: absolute; right: 1px; top: 3px; width: 40px; height: 7px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.72)); border-radius: 99px; }
    .progress-copy { min-width: 62px; text-align: right; font-weight: 800; }
    .focus { padding: 25px; background: var(--green); color: white; border-color: var(--green); }
    .focus .section-kicker { color: rgba(255,255,255,.68); }
    .focus-time { margin: 6px 0 10px; font-family: Georgia, serif; font-size: 31px; }
    .focus-title { font-size: 16px; line-height: 1.5; color: rgba(255,255,255,.9); }
    .tabs { display: grid; grid-template-columns: repeat(7, minmax(94px,1fr)); gap: 9px; margin: 18px 0; overflow-x: auto; padding-bottom: 3px; }
    .day-tab { min-width: 94px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.7); padding: 12px 11px; text-align: left; color: var(--muted); }
    .day-tab b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 3px; }
    .day-tab.active { color: rgba(255,255,255,.76); background: var(--ink); border-color: var(--ink); }
    .day-tab.active b { color: white; }
    .workspace { display: grid; grid-template-columns: 1fr 290px; gap: 18px; }
    .list-panel { padding: 9px 20px 18px; min-height: 460px; }
    .list-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 10px; border-bottom: 1px solid var(--line); }
    .list-head h3 { margin: 0; font-size: 17px; }
    .count { color: var(--muted); font-size: 13px; }
    .task { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: start; padding: 16px 2px; border-bottom: 1px solid #ecece6; }
    .task:last-child { border-bottom: 0; }
    .check { width: 23px; height: 23px; border: 1.5px solid #bcc3ba; border-radius: 7px; background: white; color: white; display: grid; place-items: center; padding: 0; }
    .check.done { background: var(--green); border-color: var(--green); }
    .task-title-input { width: 100%; border: 0; border-radius: 7px; padding: 2px 5px; margin: -2px -5px 6px; color: var(--ink); background: transparent; font-size: 15px; font-weight: 780; }
    .task-title-input:hover, .task-title-input:focus { background: #f4f5f0; box-shadow: none; }
    .task.done .task-title-input { text-decoration: line-through; color: #899089; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .tags-editor { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .custom-tag { display: inline-flex; align-items: center; gap: 4px; border: 1px solid color-mix(in srgb, var(--tag-color) 45%, white); border-radius: 99px; padding: 2px 5px 2px 7px; background: color-mix(in srgb, var(--tag-color) 16%, white); }
    .tag-text { width: 68px; border: 0; padding: 2px; color: color-mix(in srgb, var(--tag-color) 75%, #172019); background: transparent; font-size: 12px; font-weight: 800; box-shadow: none !important; }
    .tag-color { width: 18px; height: 18px; border: 0; padding: 0; border-radius: 50%; overflow: hidden; background: transparent; }
    .tag-color::-webkit-color-swatch-wrapper { padding: 0; }
    .tag-color::-webkit-color-swatch { border: 0; border-radius: 50%; }
    .tag-remove { width: 18px; height: 18px; border: 0; border-radius: 50%; padding: 0; color: #777; background: rgba(255,255,255,.55); line-height: 1; }
    .tag-reuse { width: 112px; border: 1px dashed #bdc4bc; border-radius: 99px; padding: 3px 22px 3px 8px; color: #69736b; background-color: transparent; font-size: 12px; font-weight: 750; box-shadow: none; }
    .priority-select { width: auto; border: 0; border-radius: 99px; padding: 3px 24px 3px 8px; color: #545f56; background: #f0f1ec; font-size: 12px; font-weight: 750; }
    .priority-select.high { color: #a33c31; background: #fae7e4; }
    .priority-select.low { color: #68736a; background: #eff0ec; }
    .note-input { width: 100%; min-height: 36px; margin-top: 10px; padding: 8px 10px; resize: vertical; border: 1px solid #e2e4dd; border-radius: 9px; color: var(--ink); background: #fafaf7; outline: none; line-height: 1.45; }
    .note-input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(37,92,72,.08); }
    .time-editor { display: flex; align-items: center; gap: 6px; margin-top: 9px; color: var(--muted); font-size: 12px; }
    .time-input { width: 106px; padding: 6px 8px; border-radius: 8px; font-size: 12px; }
    .time-toggle { border: 1px solid #dfe2db; border-radius: 8px; padding: 6px 9px; color: var(--green); background: #f7f8f4; font-size: 12px; font-weight: 750; }
    .deadline-editor { display: flex; align-items: center; gap: 6px; margin-top: 9px; color: var(--muted); font-size: 12px; }
    .deadline-label { font-weight: 600; }
    .deadline-input { width: 130px; padding: 6px 8px; border: 1px solid #dfe2db; border-radius: 8px; font-size: 12px; background: #fafaf7; }
    .deadline-status { font-weight: 600; color: var(--green); }
    .deadline-editor.urgent .deadline-status { color: var(--orange); }
    .deadline-editor.overdue .deadline-status { color: var(--red); }
    .deadline-toggle { border: 1px solid #dfe2db; border-radius: 8px; padding: 6px 9px; color: var(--green); background: #f7f8f4; font-size: 12px; font-weight: 750; }
    .snooze-toggle { border: 1px solid #dfe2db; border-radius: 8px; padding: 6px 9px; color: var(--green); background: #f7f8f4; font-size: 12px; font-weight: 750; margin-top: 9px; width: fit-content; }
    .task-progress { display: grid; grid-template-columns: auto minmax(150px, 1fr) 74px; align-items: center; gap: 10px; margin-top: 11px; color: var(--muted); font-size: 12px; }
    .cow-progress { --progress: 0%; height: 32px; position: relative; }
    .grass-track { position: absolute; left: 0; right: 0; bottom: 4px; height: 9px; border-radius: 99px; background: linear-gradient(90deg, #c9dfb2, #6fa85f); box-shadow: inset 0 1px 2px rgba(37,92,72,.18); overflow: hidden; }
    .grass-track::after { content: "🌱  🌿  🌱  🌿  🌱  🌿  🌱  🌿  🌱"; position: absolute; right: 2px; bottom: -1px; white-space: nowrap; font-size: 11px; letter-spacing: 4px; opacity: .9; }
    .cow-runner { position: absolute; left: clamp(13px, var(--progress), calc(100% - 13px)); top: -2px; z-index: 2; font-size: 24px; line-height: 1; transform: translateX(-50%); transition: left .12s ease-out; filter: drop-shadow(0 2px 2px rgba(31,66,48,.2)); pointer-events: none; }
    .task-progress.complete .grass-track::after { opacity: 0; transform: scaleX(.08); transform-origin: right center; }
    .task-progress.celebrating .grass-track::after { animation: grass-eaten .75s .12s ease-in forwards; }
    .task-progress.celebrating .cow-runner { animation: cow-chew .24s .1s ease-in-out 6 alternate; }
    .completion-feedback { display: inline-flex; align-items: center; gap: 3px; color: var(--green); }
    .task-progress.celebrating .completion-feedback { animation: completion-pop .42s .15s cubic-bezier(.2,.9,.25,1.25) both; }
    .completion-feedback b { font-style: normal; white-space: nowrap; }
    .completion-feedback i { font-style: normal; }
    .task-progress.celebrating .completion-feedback i { animation: sparkle-pulse .48s ease-in-out 3 alternate; }
    @keyframes grass-eaten { to { opacity: 0; transform: scaleX(.08); } }
    @keyframes cow-chew { from { transform: translateX(-50%) rotate(-3deg) scale(1); } to { transform: translateX(-50%) rotate(3deg) scale(1.12,.9); } }
    @keyframes completion-pop { from { opacity: 0; transform: translateY(5px) scale(.82); } to { opacity: 1; transform: none; } }
    @keyframes sparkle-pulse { to { transform: scale(1.35) rotate(16deg); } }
    .cow-progress input[type="range"] { position: absolute; inset: 0; z-index: 3; height: 32px; margin: 0; padding: 0; border: 0; opacity: 0; cursor: grab; box-shadow: none; }
    .cow-progress input[type="range"]:active { cursor: grabbing; }
    .task-progress output { color: var(--green); font-weight: 850; text-align: right; white-space: nowrap; }
    .delete { border: 0; border-radius: 9px; padding: 7px 9px; color: #929890; background: transparent; }
    .delete:hover { color: var(--red); background: #fae8e5; }
    .empty { padding: 70px 20px; text-align: center; color: var(--muted); }
    .side-stack { display: grid; gap: 18px; height: max-content; }
    .summary-panel, .calendar-panel { padding: 22px; }
    .side-stack h3 { margin: 0 0 16px; }
    .calendar-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .calendar-head h3 { margin: 0; text-align: center; font-size: 16px; }
    .calendar-nav { width: 31px; height: 31px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); }
    .calendar-weekdays, .calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
    .calendar-grid { grid-auto-rows: 36px; align-items: stretch; }
    .calendar-weekdays span { padding: 4px 0 7px; text-align: center; color: var(--muted); font-size: 11px; font-weight: 750; }
    .calendar-day { width: 100%; height: 36px; min-width: 0; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; align-self: stretch; border: 0; border-radius: 9px; color: var(--ink); background: transparent; font-size: 12px; line-height: 1; position: relative; }
    .calendar-day:hover:not(:disabled) { background: var(--green-2); }
    .calendar-day.outside { color: #b7bcb6; }
    .calendar-day.weekend { color: #8a928b; }
    .calendar-day.selected { color: white; background: var(--green); font-weight: 800; }
    .calendar-day.today:not(.selected) { outline: 1px solid var(--green); font-weight: 800; }
    .calendar-number { pointer-events: none; }
    .calendar-markers { position: absolute; left: 50%; bottom: 3px; display: flex; gap: 2px; transform: translateX(-50%); pointer-events: none; }
    .calendar-markers i { width: 4px; height: 4px; border-radius: 50%; background: var(--marker); box-shadow: 0 0 0 1px rgba(255,255,255,.7); }
    .calendar-day.selected .calendar-markers i { box-shadow: 0 0 0 1px white; }
    .calendar-today { width: 100%; margin-top: 12px; padding: 8px; font-size: 12px; }
    .stat { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .stat strong { font-size: 18px; }
    .legend { margin-top: 20px; padding-top: 3px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .modal-backdrop { position: fixed; inset: 0; padding: 20px; display: none; place-items: center; background: rgba(17,24,19,.48); z-index: 10; }
    .modal-backdrop.show { display: grid; }
    .modal { width: min(540px, 100%); border-radius: 22px; background: #fff; padding: 26px; box-shadow: 0 32px 90px rgba(0,0,0,.25); }
    .weekly-modal { width: min(660px, 100%); }
    .weekly-help { margin: -10px 0 18px; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .modal h3 { margin: 0 0 20px; font-size: 22px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: grid; gap: 7px; color: var(--muted); font-size: 13px; font-weight: 700; }
    label.full { grid-column: 1 / -1; }
    input, select, textarea { width: 100%; border: 1px solid var(--line); border-radius: 11px; background: #fbfbf8; padding: 11px 12px; color: var(--ink); outline: none; }
    input:focus, select:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(37,92,72,.1); }
    .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 22px; }
    .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 30px); opacity: 0; pointer-events: none; padding: 12px 17px; background: var(--ink); color: white; border-radius: 11px; box-shadow: var(--shadow); transition: .25s; z-index: 20; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .confetti-layer { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 50; }
    .confetti { position: absolute; top: -18px; width: 10px; height: 16px; border-radius: 3px; animation: confetti-fall var(--duration) cubic-bezier(.15,.75,.45,1) forwards; transform: rotate(var(--rotation)); }
    @keyframes confetti-fall { 0% { transform: translate3d(0,-20px,0) rotate(0); opacity: 1; } 75% { opacity: 1; } 100% { transform: translate3d(var(--drift),105vh,0) rotate(820deg); opacity: 0; } }
    .button-edit { margin-left: 7px; font-size: 12px; opacity: .7; }
    .time-fields { display: none; grid-column: 1 / -1; grid-template-columns: 1fr 1fr; gap: 14px; }
    .time-fields.show { display: grid; }
    .tag-color-label { display: flex; align-items: center; gap: 8px; }
    .form-color { width: 44px; height: 42px; padding: 3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
      .confetti { display: none !important; }
      .task-progress.complete .grass-track::after { opacity: 0; transform: scaleX(.08); }
    }
    @media (max-width: 820px) {
      .shell { padding: 22px 15px 60px; }
      header { align-items: flex-start; flex-direction: column; }
      .header-actions { justify-content: flex-start; }
      .top-grid, .workspace { grid-template-columns: 1fr; }
      .side-stack { order: -1; }
      .task { grid-template-columns: 32px 1fr auto; gap: 8px; }
    }
    @media (max-width: 520px) {
      .form-grid { grid-template-columns: 1fr; }
      label.full { grid-column: auto; }
      .task { grid-template-columns: 30px 1fr auto; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="header-copy">
        <div class="header-edit-line"><div class="eyebrow" id="headerKicker">Weekly operations desk</div><button class="inline-edit-trigger" id="editHeaderKicker" aria-label="修改第一行">✎</button></div>
        <div class="header-edit-line"><h1 id="appTitle">狗牛</h1><button class="inline-edit-trigger" id="editAppTitle" aria-label="修改第二行">✎</button></div>
        <div class="header-edit-line"><div class="date-line" id="todayDate"></div><button class="inline-edit-trigger" id="editDateLine" aria-label="修改第三行" title="清空内容可恢复自动日期">✎</button></div>
      </div>
      <div class="header-actions"><button class="btn" id="updateBtn" title="通过 GitHub Release 检查新版本">↻ 检查更新</button><button class="btn" id="weeklyBtn">＋ 每周任务 🌾</button><button class="btn primary" id="addBtn">＋ <span id="addButtonLabel">新增任务</span><span class="button-edit" id="editAddButton" title="修改按钮标题">✎</span></button></div>
    </header>

    <section class="top-grid">
      <div class="panel today">
        <div class="editable-heading"><div class="section-kicker" id="progressTitle">今日完成度</div><button class="edit-heading" id="editProgressTitle" aria-label="修改标题">✎</button></div>
        <h2 id="todaySummary">正在整理今天的工作</h2>
        <div class="progress-row"><div class="rocket-track"><span class="rocket-fill" id="progressBar"><span class="rocket">🚀</span></span></div><div class="progress-copy" id="progressText">0%</div></div>
      </div>
      <div class="panel focus">
        <div class="section-kicker">下一项</div>
        <div class="focus-time" id="focusNumber">—</div>
        <div class="focus-title" id="focusTitle">今天的工作已完成</div>
      </div>
    </section>

    <nav class="tabs" id="tabs" aria-label="选择日期"></nav>

    <section class="workspace">
      <div class="panel list-panel">
        <div class="list-head"><h3 id="listTitle">今日安排</h3><span class="count" id="taskCount"></span></div>
        <div id="taskList"></div>
      </div>
      <aside class="side-stack">
        <div class="panel calendar-panel">
          <div class="calendar-head"><button class="calendar-nav" id="prevMonth" aria-label="上个月">‹</button><h3 id="calendarTitle"></h3><button class="calendar-nav" id="nextMonth" aria-label="下个月">›</button></div>
          <div class="calendar-weekdays"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
          <div class="calendar-grid" id="calendarGrid"></div>
          <button class="btn ghost calendar-today" id="currentWeekBtn">回到本周</button>
        </div>
        <div class="panel summary-panel">
          <h3 id="summaryTitle">本周概览</h3>
          <div class="stat"><span>本周任务</span><strong id="cnCount">0</strong></div>
          <div class="stat"><span>平均进展</span><strong id="osCount">0%</strong></div>
          <div class="stat"><span>已完成</span><strong id="doneCount">0</strong></div>
          <div class="stat"><span>待完成</span><strong id="todoCount">0</strong></div>
          <div class="legend" id="weeklyInsights"></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <form class="modal" id="taskForm">
      <h3 id="modalTitle">新增工作需求</h3>
      <div class="form-grid">
        <label class="full">需求名称<input id="titleInput" required maxlength="60" placeholder="例如：临时活动海报修改" /></label>
        <label>初始标签<input id="tagInput" list="tagLibraryOptions" maxlength="20" placeholder="输入或选择历史标签" /></label>
        <label class="tag-color-label">标签颜色<input class="form-color" id="tagColorInput" type="color" value="#6b7280" /></label>
        <label>优先级<select id="priorityInput"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></label>
        <label>安排日期<input id="dateInput" type="date" required /></label>
        <label class="full">具体时间<select id="timeModeInput"><option value="none" selected>无具体时间</option><option value="timed">设置具体时间</option></select></label>
        <div class="time-fields" id="timeFields"><label>开始时间<input id="startTimeInput" type="time" /></label><label>结束时间<input id="endTimeInput" type="time" /></label></div>
        <label class="full">截止日期（可选）<input id="deadlineInput" type="date" placeholder="选择截止日期" /></label>
        <label>月历标识<select id="markerModeInput"><option value="none" selected>普通任务</option><option value="marked">显示彩色点</option></select></label>
        <label class="tag-color-label">标识颜色<input class="form-color" id="markerColorInput" type="color" value="#8b5cf6" /></label>
        <label class="full">任务备注<textarea id="noteInput" rows="3" maxlength="500" placeholder="可选：记录要求、链接或进展"></textarea></label>
      </div>
      <div class="form-actions"><button type="button" class="btn ghost" id="cancelBtn">取消</button><button class="btn primary" type="submit">添加任务</button></div>
    </form>
  </div>
  <div class="modal-backdrop" id="weeklyModalBackdrop" role="dialog" aria-modal="true" aria-labelledby="weeklyModalTitle">
    <form class="modal weekly-modal" id="weeklyTaskForm">
      <h3 id="weeklyModalTitle">新增每周任务</h3>
      <p class="weekly-help">每行填写一个任务，系统会自动分配到本周并安排时间；生成后可在任务卡片中继续修改日期、时间、标题和进展。</p>
      <div class="form-grid">
        <label class="full">一周任务清单<textarea id="weeklyTasksInput" rows="7" required maxlength="2000" placeholder="例如：&#10;完成活动方案&#10;准备客户会议&#10;发布本周内容"></textarea></label>
        <label>所在周<input id="weeklyStartInput" type="date" required /></label>
        <label>分配范围<select id="weeklyRangeInput"><option value="weekdays" selected>周一至周五</option><option value="allweek">整周（含周末）</option></select></label>
        <label>每天开始时间<input id="weeklyTimeInput" type="time" value="09:00" required /></label>
        <label>每项时长<select id="weeklyDurationInput"><option value="30">30 分钟</option><option value="60" selected>60 分钟</option><option value="90">90 分钟</option><option value="120">120 分钟</option></select></label>
        <label>默认标签<input id="weeklyTagInput" list="tagLibraryOptions" maxlength="20" placeholder="输入或选择历史标签" /></label>
        <label>默认优先级<select id="weeklyPriorityInput"><option value="高">高</option><option value="中" selected>中</option><option value="低">低</option></select></label>
      </div>
      <div class="form-actions"><button type="button" class="btn ghost" id="weeklyCancelBtn">取消</button><button class="btn primary" type="submit">自动生成一周任务</button></div>
    </form>
  </div>
  <div class="toast" id="toast"></div>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>
  <datalist id="tagLibraryOptions"></datalist>

  <script src="app.js"></script>
</body>
</html>
