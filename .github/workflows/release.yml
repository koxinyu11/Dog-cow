name: Prepare desktop release artifacts
# Publication and legacy Sparkle feed changes require a separate explicit release.
# A v3 tag must never run the old Sparkle signing/publishing pipeline.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run make:mac
      - uses: actions/upload-artifact@v4
        with:
          name: dogcow-release-candidate
          path: out/make/
