name: Publish desktop release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release-main
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - id: version
        run: node scripts/release-version.mjs
  build:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node node_modules/electron/install.js
      - name: Stamp candidate version
        run: npm version ${{ needs.version.outputs.version }} --no-git-tag-version --ignore-scripts
      - run: npm test
      - run: python3 tests/auto_sync_test.py
      - name: Verify Apple Silicon runner
        run: node -e "if (process.platform !== 'darwin' || process.arch !== 'arm64') throw Error('Expected a Mac arm64 runner')"
      - run: npm run make:mac
      - run: node scripts/collect-release-assets.mjs darwin arm64 ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: release-assets/
          if-no-files-found: error
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          name: release-darwin-arm64
          path: release-assets
      - name: Publish only complete verified artifacts
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -type f | wc -l)" -eq 2
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "狗牛 v$VERSION" --generate-notes --draft
          gh release upload "v$VERSION" release-assets/*
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq '[.assets[] | select(.state == "uploaded" and (.digest | startswith("sha256:")))] | length == 3' | grep -qx true
          gh release edit "v$VERSION" --draft=false --latest
