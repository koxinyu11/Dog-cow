name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal Mac app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: chmod +x scripts/build.sh && ./scripts/build.sh && cp "dist/狗牛-通用版-Mac安装包.zip" dist/DogCow-Mac.zip
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/DogCow-Mac.zip --generate-notes --title "狗牛 $GITHUB_REF_NAME"
