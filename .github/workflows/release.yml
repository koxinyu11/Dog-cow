name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: dogcow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Validate update signing configuration
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          test -n "$SPARKLE_PUBLIC_ED_KEY"
          test -n "$SPARKLE_ED_KEY"
      - name: Build universal Mac app
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          chmod +x scripts/build.sh scripts/fetch-sparkle.sh scripts/update-appcast.sh
          ./scripts/build.sh
          cp "dist/狗牛-通用版-Mac安装包.zip" dist/DogCow-Mac.zip
      - name: Sign update archive
        id: sparkle
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
        run: |
          set -euo pipefail
          SIGN_OUTPUT="$(printf '%s' "$SPARKLE_ED_KEY" | .build-dependencies/Sparkle-2.9.6/bin/sign_update --ed-key-file - dist/DogCow-Mac.zip)"
          ED_SIGNATURE="$(printf '%s\n' "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          test -n "$ED_SIGNATURE"
          echo "signature=$ED_SIGNATURE" >> "$GITHUB_OUTPUT"
          echo "length=$(stat -f '%z' dist/DogCow-Mac.zip)" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/DogCow-Mac.zip --generate-notes --title "狗牛 $GITHUB_REF_NAME"
      - name: Publish appcast to main
        env:
          GH_TOKEN: ${{ github.token }}
          ED_SIGNATURE: ${{ steps.sparkle.outputs.signature }}
          ARCHIVE_LENGTH: ${{ steps.sparkle.outputs.length }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DOWNLOAD_URL="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.name == "DogCow-Mac.zip") | .url')"
          test -n "$DOWNLOAD_URL"
          git switch main
          git pull --rebase origin main
          ./scripts/update-appcast.sh "$VERSION" "$DOWNLOAD_URL" "$ARCHIVE_LENGTH" "$ED_SIGNATURE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/appcast.xml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update appcast for $GITHUB_REF_NAME"
          git push origin main
